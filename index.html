<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wayang Tangan</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,sans-serif;color:#f3dcae;display:flex;flex-direction:column;align-items:center;gap:12px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
background:
radial-gradient(ellipse 260px 120px at 8% 6%,#3a1a05 40%,transparent 41%),
radial-gradient(ellipse 300px 140px at 95% 92%,#3a1a05 40%,transparent 41%),
radial-gradient(ellipse 240px 110px at 4% 96%,#3a1a05 40%,transparent 41%),
radial-gradient(ellipse at 50% 35%,#c9801a 0%,#7a3d0a 55%,#2a1203 100%);}
#kelir{position:relative;width:min(96vw,900px);aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:2px solid #1b1008;
background:radial-gradient(ellipse at 50% 40%,#fff3cf 0%,#f0dca4 70%,#d9bd7c 100%);box-shadow:0 10px 40px #000a}
#kelir::before{content:"";position:absolute;inset:0 0 auto 0;height:7%;z-index:2;
background:repeating-linear-gradient(90deg,#6b1f12 0 14px,#b8862b 14px 18px);border-bottom:3px solid #3b1208}
#kelir::after{content:"";position:absolute;inset:auto 0 0 0;height:6%;z-index:2;background:repeating-linear-gradient(90deg,#5a1a10 0 10px,#c08a2e 10px 13px,#2a1410 13px 24px)}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;touch-action:none}
@media (orientation:portrait){#kelir{aspect-ratio:3/4}}
#cap{position:absolute;left:10px;bottom:8%;z-index:3;font-size:12px;background:#000a;padding:4px 10px;border-radius:99px}
#snd{position:absolute;right:10px;top:9%;z-index:3;border:0;border-radius:50%;width:34px;height:34px;background:#000a;color:#fff;font-size:16px;cursor:pointer}
#bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
button,label.b{background:#f3dcae;color:#3b1208;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px}
input[type=file]{display:none}
video{width:150px;border-radius:8px;transform:scaleX(-1);border:2px solid #f3dcae55;display:none}
#st{font-size:13px;opacity:.85;text-align:center}
</style>
</head>
<body>
<div id="kelir">
  <canvas id="cv"></canvas>
  <button id="snd" title="Suara gamelan">🔇</button>
  <div id="cap">Dua wayang · satu per tangan</div>
</div>
<div id="bar">
  <button id="cam">Aktifkan kamera</button>
  <label class="b">Karakter kiri<input type="file" id="fl" accept="image/*"></label>
  <label class="b">Karakter kanan<input type="file" id="fr" accept="image/*"></label>
  <video id="vid" playsinline muted></video>
</div>
<div id="st">Tanpa kamera pun bisa: geser satu atau dua jari (atau mouse) di kelir. Untuk karakter sendiri, unggah PNG berlatar transparan.</div>

<script type="module">

const cv = document.getElementById('cv'), g = cv.getContext('2d');
const vid = document.getElementById('vid'), st = document.getElementById('st');
let W = 0, H = 0;
function resize(){ const d = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W*d; cv.height = H*d; g.setTransform(d,0,0,d,0,0); }
addEventListener('resize', resize); resize();

// Karakter bawaan (placeholder asli) — ganti lewat tombol unggah
function bawaan(c1, c2){
  const c = document.createElement('canvas'); c.width = 300; c.height = 520; const x = c.getContext('2d');
  x.lineJoin = 'round'; x.strokeStyle = '#d9a441'; x.lineWidth = 6;
  x.beginPath(); x.moveTo(110,190); x.quadraticCurveTo(60,330,90,500); x.lineTo(210,500); x.quadraticCurveTo(240,330,190,190); x.closePath();
  x.fillStyle = c1; x.fill(); x.save(); x.clip(); x.fillStyle = c2;
  for(let i=0;i<6;i++) x.fillRect(60,250+i*42,190,16); x.restore(); x.stroke();
  x.lineWidth = 11; x.beginPath(); x.moveTo(185,205); x.lineTo(255,120); x.stroke();
  x.lineWidth = 6; x.fillStyle = '#e8b04a';
  x.beginPath(); x.arc(150,125,48,0,7); x.fill(); x.stroke();
  x.beginPath(); x.moveTo(104,125); x.lineTo(70,150); x.lineTo(106,150); x.fillStyle = '#e8b04a'; x.fill(); x.stroke();
  x.beginPath(); x.moveTo(102,90); x.lineTo(150,20); x.lineTo(198,90); x.fillStyle = c2; x.fill(); x.stroke();
  x.fillStyle = '#2a1203'; x.beginPath(); x.arc(125,118,5,0,7); x.fill();
  return c;
}
const P = [
  {img: bawaan('#a3231b','#1f3f8f'), x:.25, y:.55, r:0, s:1, tx:.25, ty:.55, tr:0, ts:1},
  {img: bawaan('#1f3f8f','#a3231b'), x:.75, y:.55, r:0, s:1, tx:.75, ty:.55, tr:0, ts:1}
];
function muat(file, i){ if(!file) return; const im = new Image(); im.onload = () => P[i].img = im; im.src = URL.createObjectURL(file); }
document.getElementById('fl').onchange = e => muat(e.target.files[0], 0);
document.getElementById('fr').onchange = e => muat(e.target.files[0], 1);

// Kontrol mouse (cadangan)
let handsOn = 0;
cv.addEventListener('pointermove', e => {
  if(performance.now() - handsOn < 500) return;
  const b = cv.getBoundingClientRect(), nx = (e.clientX-b.left)/b.width, ny = (e.clientY-b.top)/b.height;
  const p = P[nx < .5 ? 0 : 1]; p.tr = (nx - p.tx)*2; p.tx = nx; p.ty = ny;
});

// Kamera + deteksi tangan
let lm = null;
document.getElementById('cam').onclick = async e => {
  e.target.disabled = true; st.textContent = 'Meminta izin kamera…';
  try{
    vid.srcObject = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});
    await vid.play(); vid.style.display = 'block';
    st.textContent = 'Memuat model pelacakan tangan…';
    const {HandLandmarker, FilesetResolver} = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    lm = await HandLandmarker.createFromOptions(fs, {
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:"GPU"},
      runningMode:"VIDEO", numHands:2});
    st.textContent = 'Angkat kedua tangan di depan kamera. Cubit jari untuk membuat wayang mengangguk.';
  }catch(err){ st.textContent = 'Kamera/model gagal dimuat: ' + err.message + ' (buka lewat localhost dan pastikan internet aktif)'; e.target.disabled = false; }
};
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
function baca(){
  if(!lm || vid.readyState < 2) return;
  const res = lm.detectForVideo(vid, performance.now());
  if(!res.landmarks.length) return;
  handsOn = performance.now();
  const hs = res.landmarks.map(l => {
    const cx = [0,5,9,13,17].reduce((a,i) => a + (1-l[i].x), 0)/5, cy = [0,5,9,13,17].reduce((a,i) => a + l[i].y, 0)/5;
    const size = dist(l[0], l[9]);
    return {x:cx, y:cy, size, rot:Math.atan2((1-l[9].x)-(1-l[0].x), -(l[9].y-l[0].y)), pinch: dist(l[4], l[8])/size < .35};
  }).sort((a,b) => a.x-b.x);
  const asg = hs.length === 1 ? [[hs[0].x < .5 ? 0 : 1, hs[0]]] : [[0,hs[0]],[1,hs[1]]];
  for(const [i,h] of asg){
    const p = P[i];
    p.tx = Math.min(.95, Math.max(.05, (h.x-.1)/.8)); p.ty = Math.min(.9, Math.max(.2, (h.y-.15)/.7));
    p.tr = h.rot + (h.pinch ? .3 : 0); p.ts = Math.min(1.4, Math.max(.7, h.size/.16));
  }
}

// Gambar
function gambar(p, t, i){
  const idle = performance.now() - handsOn > 500;
  const sway = idle ? Math.sin(t/900 + i*2)*.04 : 0;
  const h = H*.62*p.s, w = h*p.img.width/p.img.height, px = p.x*W, py = p.y*H;
  g.save(); g.translate(px, py); g.rotate(p.r + sway);
  g.strokeStyle = '#2a1608'; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(w*.05, h*.1); g.lineTo(w*.12, H*1.3); g.stroke();
  g.shadowColor = 'rgba(60,30,0,.45)'; g.shadowBlur = 14; g.shadowOffsetX = 22; g.shadowOffsetY = 14;
  g.drawImage(p.img, -w/2, -h/2, w, h);
  g.restore();
}
function loop(t){
  baca();
  for(const p of P){ p.x += (p.tx-p.x)*.25; p.y += (p.ty-p.y)*.25; p.r += (p.tr-p.r)*.2; p.s += (p.ts-p.s)*.15; p.tr *= .96; }
  g.clearRect(0,0,W,H);
  P.forEach((p,i) => gambar(p,t,i));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Suara latar bergaya gamelan
let ac, on = false, tm; const nada = [261.6,293.7,349.2,392,440,523.3,587.3];
const snd = document.getElementById('snd');
function bunyi(){
  const o = ac.createOscillator(), a = ac.createGain(), n = ac.currentTime;
  o.type = 'sine'; o.frequency.value = nada[Math.random()*nada.length|0]*(Math.random()<.3?.5:1);
  a.gain.setValueAtTime(.0001,n); a.gain.exponentialRampToValueAtTime(.12,n+.01); a.gain.exponentialRampToValueAtTime(.0001,n+1.6);
  o.connect(a).connect(ac.destination); o.start(); o.stop(n+1.7);
}
snd.onclick = () => { ac = ac || new AudioContext(); on = !on; snd.textContent = on ? '🔊' : '🔇'; clearInterval(tm); if(on) tm = setInterval(bunyi, 650); };
</script>
</body>
</html>
